version: 1
title: Configuration

# This meta-configuration describes how cms.config.yml is presented in the
# Settings workspace. The project configuration remains the edited data.
sections:
  site:
    path: site
    label: Site
    icon: settings
    mode: object
    item_type: site
  node_types:
    path: node_types
    label: Data types
    icon: layers
    mode: map
    item_type: node_type
  collections:
    path: collections
    label: Collections
    icon: files
    mode: map
    item_type: collection

types:
  site:
    label: Site
    icon: settings
    label_field: name
    groups:
      general:
        label: General
        icon: settings
        fields: [name, locale]
      media:
        label: Media
        icon: image
        fields: [media_folder, public_folder]
    fields:
      name: { label: Site name, widget: string, required: true }
      locale: { label: Locale, widget: string, required: false, hint: "For example: en or de-CH" }
      media_folder: { label: Media folder, widget: string, required: true }
      public_folder: { label: Public media path, widget: string, required: true }

  node_type:
    label: Data type
    icon: layers
    label_field: label
    icon_field: icon
    defaults:
      label: New data type
      kind: content
      icon: file-text
      fields: {}
    groups:
      identity:
        label: Identity
        icon: layers
        fields: [$key, label, kind, icon]
    fields:
      $key:
        label: Type key
        widget: key
        required: true
        hint: "Stable machine name used by records and allowed_types."
      label: { label: Label, widget: string, required: true }
      kind:
        label: Kind
        widget: select
        required: true
        options:
          - { label: Document, value: document }
          - { label: Content, value: content }
          - { label: Structure, value: structure }
      icon:
        label: Icon
        widget: select
        required: false
        options:
          - { label: File, value: file-text }
          - { label: Files, value: files }
          - { label: Text, value: align-left }
          - { label: Image, value: image }
          - { label: Grid, value: columns-3 }
          - { label: Column, value: panel-left }
          - { label: Article, value: newspaper }
          - { label: Layers, value: layers }
          - { label: Settings, value: settings }
    children:
      fields:
        path: fields
        label: Fields
        icon: list
        mode: map
        item_type: field
      slots:
        path: slots
        label: Slots
        icon: layers
        mode: map
        item_type: slot
      panels:
        path: views.detail.panels
        label: Inspector panels
        icon: settings
        mode: map
        item_type: panel

  field:
    label: Field
    icon: list
    label_field: label
    defaults:
      label: New field
      widget: string
      required: false
    groups:
      identity:
        label: Identity
        icon: list
        fields: [$key, label, widget]
      behavior:
        label: Behavior
        icon: settings
        fields: [required, readonly, default, hint]
      source:
        label: Options & source
        icon: layers
        fields: [options, collection, value_field, accept]
    fields:
      $key:
        label: Field key
        widget: key
        required: true
      label: { label: Label, widget: string, required: true }
      widget:
        label: Widget
        widget: select
        required: true
        options:
          - { label: Text line, value: string }
          - { label: Text area, value: text }
          - { label: Markdown, value: markdown }
          - { label: Select, value: select }
          - { label: Boolean, value: boolean }
          - { label: Date/time, value: datetime }
          - { label: Number, value: number }
          - { label: Image upload, value: image }
          - { label: Collection reference, value: reference }
          - { label: UUID, value: uuid }
          - { label: Object wrapper, value: object }
          - { label: List, value: list }
      required: { label: Required, widget: boolean, required: false, default: false }
      readonly: { label: Read only, widget: boolean, required: false, default: false }
      default:
        label: Default value
        widget: scalar
        required: false
        hint: "The existing scalar type is preserved."
      hint: { label: Help text, widget: text, required: false }
      options:
        label: Select options
        widget: list
        required: false
        show_when: { field: widget, equals: select }
        item:
          label: Option
          widget: object
          fields:
            label: { label: Label, widget: string, required: true }
            value: { label: Value, widget: string, required: true }
      collection:
        label: Referenced collection
        widget: select
        options_from: collections
        required: false
        show_when: { field: widget, equals: reference }
      value_field:
        label: Referenced value field
        widget: string
        required: false
        show_when: { field: widget, equals: reference }
      accept:
        label: Accepted media types
        widget: string
        required: false
        show_when: { field: widget, equals: image }
    children:
      object_fields:
        path: fields
        label: Object fields
        icon: list
        mode: map
        item_type: field
        when: { field: widget, equals: object }
      list_item:
        path: item
        label: List item
        icon: list
        mode: object
        item_type: list_item
        when: { field: widget, equals: list }

  list_item:
    label: List item
    icon: list
    defaults:
      label: Item
      widget: string
    groups:
      general:
        label: Item definition
        icon: list
        fields: [label, widget, required]
    fields:
      label: { label: Label, widget: string, required: false }
      widget:
        label: Widget
        widget: select
        required: true
        options:
          - { label: Text line, value: string }
          - { label: Number, value: number }
          - { label: Boolean, value: boolean }
          - { label: Object wrapper, value: object }
      required: { label: Required, widget: boolean, required: false }
    children:
      object_fields:
        path: fields
        label: Object fields
        icon: list
        mode: map
        item_type: field
        when: { field: widget, equals: object }

  slot:
    label: Slot
    icon: layers
    label_field: label
    defaults:
      label: New slot
      allowed_types: []
    groups:
      general:
        label: Slot
        icon: layers
        fields: [$key, label, allowed_types, min, max]
    fields:
      $key: { label: Slot key, widget: key, required: true }
      label: { label: Label, widget: string, required: true }
      allowed_types:
        label: Allowed data types
        widget: list
        required: true
        item:
          label: Data type
          widget: select
          options_from: node_types
      min: { label: Minimum items, widget: number, required: false }
      max: { label: Maximum items, widget: number, required: false }

  panel:
    label: Inspector panel
    icon: settings
    label_field: label
    defaults:
      label: New panel
      groups: {}
    groups:
      general:
        label: Panel
        icon: settings
        fields: [$key, label, position]
    fields:
      $key: { label: Panel key, widget: key, required: true }
      label: { label: Label, widget: string, required: true }
      position: { label: Position, widget: number, required: false }
    children:
      groups:
        path: groups
        label: Groups
        icon: layers
        mode: map
        item_type: group

  group:
    label: Inspector group
    icon: layers
    label_field: label
    defaults:
      label: New group
      fields: []
    groups:
      general:
        label: Group
        icon: layers
        fields: [$key, label, icon, position, description, fields]
    fields:
      $key: { label: Group key, widget: key, required: true }
      label: { label: Label, widget: string, required: true }
      icon: { label: Icon, widget: string, required: false }
      position: { label: Position, widget: number, required: false }
      description: { label: Description, widget: text, required: false }
      fields:
        label: Fields
        widget: list
        required: true
        item: { label: Field reference, widget: string }

  collection:
    label: Collection
    icon: files
    label_field: label
    icon_field: icon
    defaults:
      label: New collection
      label_singular: Item
      icon: files
      folder: content/items
      extension: yml
      node_type: ""
      allowed_types: []
      hierarchy: { enabled: false }
      views: { list: { type: tree } }
    groups:
      identity:
        label: Identity
        icon: files
        fields: [$key, label, label_singular, icon]
      storage:
        label: Storage
        icon: file-text
        fields: [folder, extension, slug, summary]
      model:
        label: Data model
        icon: layers
        fields: [node_type, allowed_types]
    fields:
      $key: { label: Collection key, widget: key, required: true }
      label: { label: Label, widget: string, required: true }
      label_singular: { label: Singular label, widget: string, required: true }
      icon: { label: Icon, widget: string, required: false }
      folder: { label: Content folder, widget: string, required: true }
      extension:
        label: File extension
        widget: select
        required: true
        options: [yml, yaml]
      slug: { label: Filename template, widget: string, required: false }
      summary: { label: Summary template, widget: string, required: false }
      node_type:
        label: Root data type
        widget: select
        options_from: node_types
        required: true
      allowed_types:
        label: Allowed root types
        widget: list
        required: true
        item:
          label: Data type
          widget: select
          options_from: node_types
    children:
      hierarchy:
        path: hierarchy
        label: Hierarchy
        icon: layers
        mode: object
        item_type: hierarchy
      list_view:
        path: views.list
        label: List view
        icon: list
        mode: object
        item_type: list_view
      reference_view:
        path: views.reference
        label: Reference view
        icon: image
        mode: object
        item_type: reference_view

  hierarchy:
    label: Hierarchy
    icon: layers
    defaults: { enabled: false }
    groups:
      general:
        label: Hierarchy
        icon: layers
        fields: [enabled, id_field, parent_field, allowed_child_types]
    fields:
      enabled: { label: Enabled, widget: boolean, required: true }
      id_field: { label: Identity field, widget: string, required: false }
      parent_field: { label: Parent field, widget: string, required: false }
      allowed_child_types:
        label: Allowed child types
        widget: list
        required: false
        item:
          label: Data type
          widget: select
          options_from: node_types

  list_view:
    label: List view
    icon: list
    defaults: { type: tree }
    groups:
      general:
        label: Presentation
        icon: list
        fields: [type]
    fields:
      type:
        label: View type
        widget: select
        required: true
        options:
          - { label: Tree, value: tree }
          - { label: Table, value: table }
    children:
      search:
        path: search
        label: Search
        icon: search
        mode: object
        item_type: search_view
        when: { field: type, equals: table }
      sort:
        path: sort
        label: Default sort
        icon: list
        mode: object
        item_type: sort_view
        when: { field: type, equals: table }
      columns:
        path: columns
        label: Columns
        icon: list
        mode: list
        item_type: table_column
        when: { field: type, equals: table }

  search_view:
    label: Search
    icon: search
    defaults: { fields: [] }
    groups:
      general:
        label: Search
        icon: search
        fields: [fields]
    fields:
      fields:
        label: Searchable fields
        widget: list
        required: true
        item: { label: Field reference, widget: string }

  sort_view:
    label: Default sort
    icon: list
    defaults: { field: "", direction: asc }
    groups:
      general:
        label: Sort
        icon: list
        fields: [field, direction]
    fields:
      field: { label: Field, widget: string, required: true }
      direction:
        label: Direction
        widget: select
        required: true
        options:
          - { label: Ascending, value: asc }
          - { label: Descending, value: desc }

  table_column:
    label: Table column
    icon: list
    label_field: label
    defaults:
      field: title
      mode: read
      width: minmax(10rem, 1fr)
    groups:
      general:
        label: Column
        icon: list
        fields: [field, label, mode, display, appearance, align, width, sortable]
    fields:
      field: { label: Field reference, widget: string, required: true }
      label: { label: Label override, widget: string, required: false }
      mode:
        label: Mode
        widget: select
        options: [read, edit]
        required: true
      display:
        label: Display
        widget: select
        required: false
        options: [text, date, datetime, toggle, select, badge, code, image]
      appearance:
        label: Appearance
        widget: select
        required: false
        options: [title, muted, monospace]
      align:
        label: Alignment
        widget: select
        required: false
        options: [left, center, right]
      width: { label: Width, widget: string, required: true }
      sortable: { label: Sortable, widget: boolean, required: false }

  reference_view:
    label: Reference view
    icon: image
    defaults: {}
    groups:
      general:
        label: Reference presentation
        icon: image
        fields: [value, image, title, description]
    fields:
      value: { label: Stored value field, widget: string, required: false }
      image: { label: Image field, widget: string, required: false }
      title: { label: Title field, widget: string, required: false }
      description:
        label: Description fields
        widget: list
        required: false
        item: { label: Field reference, widget: string }
